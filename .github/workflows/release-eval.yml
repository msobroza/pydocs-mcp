name: Release (eval)

# Publishes the `pydocs-mcp-eval` benchmark distribution to PyPI. It is a
# pure-Python package built from the benchmarks/ subdirectory, so — unlike
# release.yml (which cross-compiles the Rust wheel per platform) — one Linux
# job producing a single `py3-none-any` wheel + sdist is all that's needed.
# Tag it `eval-v<version>` so it never collides with the product's `v<version>`
# tags that drive release.yml.

on:
  push:
    tags: ["eval-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/eval-v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/eval-v}
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" benchmarks/pyproject.toml
          rm -f benchmarks/*.bak
          echo "Synced pydocs-mcp-eval version to $VERSION"
        shell: bash
      - uses: astral-sh/setup-uv@v4
      - name: Build (sdist + wheel) from benchmarks/
        run: uv build benchmarks/ --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: eval-dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-dist
          path: dist
      - uses: astral-sh/setup-uv@v4
      - run: uv publish dist/*

  # Mirrors release.yml's github-release job for the eval distribution. The
  # notes come from benchmarks/CHANGELOG.md, and `--latest=false` keeps the
  # product's newest `v*` Release as the repository's "Latest".
  github-release:
    name: GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/eval-v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git describe` needs the tag history for the compare link
      - uses: actions/download-artifact@v4
        with:
          name: eval-dist
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes (benchmarks/CHANGELOG.md section, else GitHub-generated)
        id: notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'eval-v*' "${TAG}^" 2>/dev/null || true)"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          if python scripts/release_notes_from_changelog.py \
               --changelog benchmarks/CHANGELOG.md --version "${TAG#eval-v}" \
               --repo "$GITHUB_REPOSITORY" --tag "$TAG" --previous-tag "$PREVIOUS_TAG" > notes.md; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub Release (attach wheel + sdist)
        shell: bash
        env:
          NOTES_SOURCE: ${{ steps.notes.outputs.source }}
          PREVIOUS_TAG: ${{ steps.notes.outputs.previous_tag }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing its assets only"
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          NOTES_ARGS=(--notes-file notes.md)
          if [ "$NOTES_SOURCE" = "generated" ]; then
            NOTES_ARGS=(--generate-notes)
            [ -n "$PREVIOUS_TAG" ] && NOTES_ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" dist/* --verify-tag --latest=false --repo "$GITHUB_REPOSITORY" \
            --title "pydocs-mcp-eval ${TAG#eval-v}" "${NOTES_ARGS[@]}"
