# The `ask_your_docs.llm` block BOTH arms of the before/after run send, passed
# with `--llm-block`. It lives here rather than in the serving YAML because the
# eval binding refuses file-sourced model settings: an arm must be deterministic,
# so what the run measures is decided by the run, not by whichever file the serve
# child happens to be pointed at.
#
#   python -m pydocs_eval.campaign before-after --baseline <sha> --candidate <sha> \
#     --config benchmarks/configs/ask_openrouter_qwen3_4b.yaml \
#     --llm-block benchmarks/configs/ask_openrouter_qwen3_8_27b_llm.yaml \
#     --split repoqa-qa/small_test --workspace ~/pydocs-index --model qwen/qwen3.8-27b
#
# `model` is deliberately absent: it comes from `--model`, which both arms share.
base_url: https://openrouter.ai/api/v1
provider: openrouter
auth:
  api_key_env: OPENROUTER_API_KEY
# `parallel_tool_calls` is deliberately ABSENT (not `null`): an unset knob is never
# sent, and a baseline commit that predates the knob rejects the key outright —
# the block must validate against the product model of BOTH arms.
# Qwen3.8 thinking-mode settings from the model card's "Best Practices"
# (Qwen/Qwen3.8-27B): temperature 1.0, top_p 0.95, top_k 20, min_p 0,
# presence_penalty 0. The harness sends temperature, top_p and the output cap;
# top_k / min_p / presence_penalty stay at the endpoint's defaults (the one
# extra-body channel carries the provider route below, not sampling keys).
# Reasoning effort: the card's best level (xhigh) is the model's own default,
# so `thinking: auto` sends no override — sending a level would only lower it.
params:
  thinking: auto
  temperature: 1.0
  top_p: 0.95
  max_tokens: 16384         # "adequate output length" for agentic turns; the run's
                            # --max-usd ceiling bounds the total spend
# The chat model's request settings: this file is their single source (spec
# 2026-09-25, Q48(c)/(d)). The three keys need a product that knows them, in
# BOTH arms — a baseline commit that predates them rejects the block, and the
# plan's per-arm block probe says so before anything is spent.
timeout_seconds: 300        # one chat request; the SDK's own default is 600
max_retries: 2              # the SDK's default, pinned so it cannot drift
provider_routing:           # the upstream the owner pinned (2026-09-26): full
  order: [deepinfra/bf16]   # precision, one endpoint; OpenRouter otherwise
  allow_fallbacks: false    # load-balances across ~16 upstreams per request
