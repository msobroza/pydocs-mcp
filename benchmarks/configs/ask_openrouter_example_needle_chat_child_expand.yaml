# The child_expand chat arm (#393): the example-needle-chat serving config
# (ask_openrouter_example_needle_chat.yaml) field for field, plus ONE change —
# the `pipelines` block at the end, which routes the default docs search to
# pipelines/exp_child_expand.yaml (the shipped default docs pipeline plus the
# overlay-only `child_expand` step). The decision and dependency routes stay
# the shipped presets. A test pins this file to the baseline config, so edit
# the two together.
#
# The arm pairs with a baseline arm on the SAME commit served by the baseline
# config (owner-gated paid run — ledger line 16):
#
#   python benchmarks/tools/run_example_needle_chat_repro.py \
#     --workspace ~/pydocs-index \
#     --config benchmarks/configs/ask_openrouter_example_needle_chat_child_expand.yaml \
#     --llm-block benchmarks/configs/ask_openrouter_qwen3_8_27b_llm.yaml \
#     --split dev --role candidate --out <run>/candidate
#
# The index is shared: child_expand is search-time only, so the baseline's
# workspace serves both arms unchanged.
embedding:
  provider: openai
  model_name: qwen/qwen3-embedding-4b
  dim: 2560
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  send_dimensions: false
extraction:
  discovery:
    project:
      # A local example_needle checkout keeps a duplicate copy of the code under
      # .claude/worktrees; the pinned commit tracks nothing there.
      exclude_dirs: [".claude"]
ask_your_docs:
  architecture: auto
  llm:
    model: qwen/qwen3.8-27b
    # qwen3.8-27b accepts text+image input on OpenRouter.
    vision: true
    # Everything below is the pinned before/after llm block
    # (ask_openrouter_qwen3_8_27b_llm.yaml), merged field for field; a test pins
    # the two together, so edit the block file and this copy in one change.
    base_url: https://openrouter.ai/api/v1
    provider: openrouter
    auth:
      api_key_env: OPENROUTER_API_KEY
    params:
      thinking: auto
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384
    timeout_seconds: 300
    max_retries: 2
    provider_routing:
      order: [deepinfra/bf16]
      allow_fallbacks: false
# The arm's one change. A route list replaces the shipped one wholesale, so the
# decision and dependency routes are restated unchanged.
pipelines:
  chunk:
    - predicate: kind_is_decision
      pipeline_path: pipelines/decision_search.yaml
    - predicate: scope_is_dependencies_only
      pipeline_path: pipelines/chunk_search_deps.yaml
    - default: true
      pipeline_path: pipelines/exp_child_expand.yaml
