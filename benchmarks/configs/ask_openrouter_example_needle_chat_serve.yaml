# The serving config a `before-after` chat arm points `--config` at: the bundle's
# embedder and discovery, and nothing else. `before-after` refuses a serving file
# that carries model settings (they reach both arms only through `--llm-block`), so
# the runner's ask_openrouter_example_needle_chat.yaml cannot be this file; the
# chat page's agent settings ride the arm overlay
# ask_example_needle_chat_bare_auto_arm.yaml instead. A test pins `embedding` and
# `extraction` to the runner's config, so edit the two in one change.
#
#   python -m pydocs_eval.campaign before-after --baseline <sha> --candidate <sha> \
#     --config benchmarks/configs/ask_openrouter_example_needle_chat_serve.yaml \
#     --llm-block benchmarks/configs/ask_openrouter_qwen3_8_27b_llm.yaml \
#     --baseline-settings benchmarks/configs/ask_example_needle_chat_bare_auto_arm.yaml \
#     --candidate-settings benchmarks/configs/ask_example_needle_chat_bare_auto_arm.yaml \
#     --split example-needle-chat/dev --workspace ~/pydocs-index --model qwen/qwen3.8-27b
#
# The key is read from $OPENROUTER_API_KEY; it never lives in this file.
embedding:
  provider: openai
  model_name: qwen/qwen3-embedding-4b
  dim: 2560
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  send_dimensions: false
extraction:
  discovery:
    project:
      # A local example_needle checkout keeps a duplicate copy of the code under
      # .claude/worktrees; the pinned commit tracks nothing there.
      exclude_dirs: [".claude"]
